# NexPay — serves the React build and reverse-proxies the API to the gateway.
# Frontend and API share the same origin, so NO CORS is needed in this setup.
#
# Install on the VM:
#   sudo cp deploy/nginx/nexpay.conf /etc/nginx/sites-available/nexpay
#   sudo ln -s /etc/nginx/sites-available/nexpay /etc/nginx/sites-enabled/nexpay
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;            # replace with your domain once you have one

    # React production build (output of `npm run build`)
    root /var/www/nexpay;
    index index.html;

    # SPA routing: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API gateway (:8080) — same-origin proxy, no CORS required
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
