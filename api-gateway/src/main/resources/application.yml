server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                # allowedOriginPatterns supports wildcards together with
                # allowCredentials=true (plain "*" is not allowed with creds).
                allowedOriginPatterns:
                  - "http://localhost:3000"        # local dev
                  - "https://*.vercel.app"         # Vercel deploys (preview + prod)
                  # - "https://nexpay.your-domain.com"  # add your custom frontend domain
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:

            # 🔐 User Auth (Signup/Login)
            - id: user-service-auth
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            # 👤 User Service (Get user info, etc.)
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            # 💸 Transaction Service
            - id: transaction-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/transactions/**

            # 💰 Wallet Service
            - id: wallet-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/wallets/**

            # 🎁 Reward Service
            - id: reward-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/rewards/**

            # 🔔 Notification Service
            - id: notification-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/notify/**

  jwt:
    secret: my-super-secret-key-that-you-never-share

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
